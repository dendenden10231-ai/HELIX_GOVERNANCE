name: Публикация досье на GitHub Pages

# ЗАЧЕМ ЭТОТ ФАЙЛ СУЩЕСТВУЕТ
#
# Досье — это HTML. Если дать рецензенту прямую ссылку на файл в
# репозитории, GitHub отдаст его как text/plain с заголовком nosniff, и
# браузер покажет исходный код вместо страницы. Для грантовой заявки это
# бесполезная ссылка.
#
# ⚠️ PAGES ПОКА НЕ ВКЛЮЧЕНЫ. Проверено 21.08 после того, как владелец
# сообщил, что включил: GitHub по-прежнему отвечает Not Found на
# GET /repos/…/pages, и все четыре возможных адреса github.io отдают 404.
# То есть сайта Pages не существует — это не «включено, но не собралось».
#
# Прошлая редакция этой шапки утверждала «включено владельцем». Я записал
# это с его слов, не проверив, и утверждение оказалось ложным. Оставляю
# запись об ошибке: репозиторий, где документ обещает несуществующее,
# опаснее репозитория без документа.
#
# ЧТО НУЖНО СДЕЛАТЬ, точный адрес без блужданий:
#   https://github.com/dendenden10231-ai/HELIX_GOVERNANCE/settings/pages
#   → Build and deployment → Source: GitHub Actions
#
# Вероятная причина неудачи: у владельца два аккаунта GitHub, а этот
# репозиторий принадлежит dendenden10231-ai. Настройка, сделанная под
# другим аккаунтом, к этому репозиторию не относится.
#
# После включения прогон запускается любым push в main; workflow_dispatch
# через API закрыт (403 Resource not accessible by integration).
#
# ПОЧЕМУ НЕ АВТОМАТИЧЕСКИ. Проверено 21.08 двумя разными путями, оба
# закрыты:
#
#   1. Прямой вызов API из сессии агента:
#      GET /repos/…/pages → 403 «Access to this GitHub API path is not
#      permitted through this proxy» — запрещает прокси Anthropic.
#
#   2. Из самого GitHub Actions, где прокси нет (прогон 32505454273):
#      actions/configure-pages@v5 с enablement: true →
#      «Create Pages site failed. Error: Resource not accessible by
#      integration». Токену GITHUB_TOKEN не хватает прав администратора
#      репозитория, и выдать их себе он не может по устройству.
#
# Поэтому enablement: true из шага ниже УБРАН: он не работает и только
# ронял прогон. Не возвращать.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Настроить Pages (включает человек, см. шапку файла)
        uses: actions/configure-pages@v5

      - name: Собрать артефакт из корня репозитория
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
